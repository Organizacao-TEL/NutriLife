{% extends 'core/base.html' %}

{% block conteudo %}

<h2>Excluir Dieta</h2>

<p>
    Tem certeza que deseja excluir a dieta
    <strong>{{ dieta.nome }}</strong>
    do cliente {{ dieta.cliente.nome }}?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sim, excluir</button>
</form>

<a href="{% url 'dietas' %}">Cancelar</a>

{% endblock %}
